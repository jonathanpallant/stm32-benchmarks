[package]
name = "stm32-benchmarks"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { path = "./cortex-m/cortex-m", features = ["critical-section-single-core"] }
cortex-m-rt = { path = "./cortex-m/cortex-m-rt", features = ["set-msplim"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"

[profile.release]
opt-level = "s"
debug = 2
