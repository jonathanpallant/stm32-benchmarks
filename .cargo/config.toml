[target.thumbv8m.main-none-eabi]
runner = "probe-rs run --chip STM32N657 --protocol swd"

[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip STM32N657 --protocol swd"

[target.thumbv8.1m.main-none-eabi]
runner = "probe-rs run --chip STM32N657 --protocol swd"

[target.thumbv8.1m.main-none-eabihf]
runner = "probe-rs run --chip STM32N657 --protocol swd"

[build]
target = "thumbv8m.main-none-eabi"

[env]
DEFMT_LOG = "info"
